# Three containers:
#   dashboard  the Python app (cameras + analytics + web server), plain HTTP on port 8000
#   mediamtx   the WebRTC media server: live video to the browsers and from the phones
#   caddy      the HTTPS front door: gets a free certificate and forwards requests
#
#   phone / browser --HTTPS (443)--> caddy --HTTP--> dashboard:8000     pages, API, JPEG fallback
#                                         \-------> mediamtx:8889      WebRTC signaling (/webrtc/...)
#   phone / browser <==WebRTC video, UDP/TCP 8189==> mediamtx
#   dashboard --RTSP (inside Docker)--> mediamtx      analyzed video out, phone video in
#
# Settings and secrets come from the .env file next to this one (copy .env.example).
# Start:  docker compose up -d --build      Stop: docker compose down      Logs: docker compose logs -f
services:
  dashboard:
    build: .
    image: multicam-dashboard
    container_name: multicam-dashboard
    environment:
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - PHONE_TOKEN=${PHONE_TOKEN:-}
      - MEDIAMTX_RTSP=rtsp://mediamtx:8554   # WebRTC on (remove this line: JPEG frames only)
    depends_on:
      - mediamtx
    ports:
      # Only reachable from this machine (http://localhost:8000, for testing).
      # Everyone else comes in through Caddy over HTTPS.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro   # edit cameras/thresholds without rebuilding
      - ./data:/app/data                    # SQLite event log survives restarts
      - ./logs:/app/logs                    # logs visible on the host (for submission)
    restart: unless-stopped                 # come back after a crash or a VM reboot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    container_name: multicam-mediamtx
    environment:
      # The address browsers send the WebRTC video to: the VM's public IP (PUBLIC_IP in .env).
      - MTX_WEBRTCADDITIONALHOSTS=${PUBLIC_IP:-127.0.0.1}
    ports:
      - "8189:8189/udp"   # WebRTC video (UDP)
      - "8189:8189/tcp"   # WebRTC video (TCP, for networks that block UDP)
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    container_name: multicam-caddy
    depends_on:
      - dashboard
      - mediamtx
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}   # the address people type, see deploy/Caddyfile
    ports:
      - "80:80"     # needed to get the certificate, and redirects http:// to https://
      - "443:443"   # HTTPS
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates: kept so they are not requested again on every restart
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
