<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Camera Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Multi-Camera Monitor</h1>
      <span class="sub">Real-time video analytics</span>
    </div>
    <a class="phone-link" href="{{ phone_link }}">📱 Add a phone camera</a>
    <div class="tiles">
      <div class="tile"><span class="tile-label">Cameras online</span><span class="tile-value" id="sum-online">–</span></div>
      <div class="tile"><span class="tile-label">People in view</span><span class="tile-value" id="sum-people">–</span></div>
      <div class="tile"><span class="tile-label">Active alerts</span><span class="tile-value" id="sum-alerts">–</span></div>
      <div class="tile"><span class="tile-label">Server time</span><span class="tile-value small" id="clock">–</span></div>
    </div>
  </header>

  <div class="banner hidden" id="conn-banner">⚠ Connection to server lost, retrying…</div>

  <main class="layout">
    <!-- One card per camera, created by dashboard.js from /api/cameras
         (phone cameras appear and disappear while the page is open). -->
    <section class="cams" id="cams" aria-label="Live cameras"></section>

    <aside class="side">
      <section class="panel">
        <h3>Alerts &amp; events</h3>
        <ol class="events" id="events"><li class="empty">No events yet</li></ol>
      </section>
      <section class="panel">
        <h3>People in view <span class="muted">· last 5 min</span></h3>
        <div class="chart-box"><canvas id="chart-people"></canvas></div>
      </section>
      <section class="panel">
        <h3>Motion <span class="muted">· % of image, last 5 min</span></h3>
        <div class="chart-box"><canvas id="chart-motion"></canvas></div>
      </section>
    </aside>
  </main>

  <!-- Card layout, copied by dashboard.js for each camera -->
  <template id="cam-template">
    <article class="cam">
      <div class="cam-head">
        <span class="swatch" aria-hidden="true"></span>
        <h2 data-field="name"></h2>
        <span class="cam-id" data-field="id"></span>
        <span class="status" data-field="status"><span class="dot"></span><span class="status-text">…</span></span>
      </div>
      <div class="video-wrap"><img alt=""></div>
      <dl class="stats">
        <div><dt>People</dt><dd data-field="people">–</dd></div>
        <div><dt>Motion</dt><dd data-field="motion">–</dd></div>
        <div><dt>FPS</dt><dd data-field="fps">–</dd></div>
        <div><dt>Brightness</dt><dd data-field="brightness">–</dd></div>
        <div><dt>Sharpness</dt><dd data-field="sharpness">–</dd></div>
      </dl>
      <div class="badges" data-field="alerts"></div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
